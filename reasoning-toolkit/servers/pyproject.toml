[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-servers"
version = "0.1.0"
description = "Deterministic MCP servers for the reasoning-toolkit plugin"
requires-python = ">=3.11"
dependencies = [
    "z3-solver==5.3.3",
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools]
packages = ["reasoning_servers"]
