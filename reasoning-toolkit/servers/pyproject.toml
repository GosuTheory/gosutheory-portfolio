[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-servers"
version = "0.1.0"
description = "Deterministic MCP servers for the reasoning-toolkit plugin"
requires-python = ">=3.11"
dependencies = [
    "z3-solver",
    "mcp<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["reasoning_servers"]
